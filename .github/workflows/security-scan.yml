# Ghost Labs security scan (DE-56, October 30, 2026; DE-98 threat feed helper, November 3, 2026): the full push scan (.githooks/security-scan.py, DE-49) on every
# pull request to main and every push to main, so a merge done on GitHub is scanned like a push from the Mac.
# Branch protection makes the "security-scan" check required on main. Any finding fails the check.
# Supply chain: the one action is pinned by commit hash, the Python scanners and every package under them by version
# and SHA-256 (.github/security-scan-tools.lock), gitleaks and shellcheck 0.11.0 by SHA-256. Known limits (Security Program section 6):
# semgrep's rule packs download fresh each run (rules are data, not code), and npm comes from GitHub's runner image.
# shellcheck is pinned so GitHub and the Mac run the same version (DE-56, October 31, 2026). A pull request can also change this workflow file itself, which only review of the change catches.
# Reporting (DE-109, PW-55, PW-56, WA-291): with the RAVENWOOD_SCAN_TOKEN secret (a Ravenwood run token scoped to this
# repo and its Patchwork asset, the repo variable PATCHWORK_ASSET), .githooks/ci-report.py reports each step to Ravenwood,
# so the scan shows live on Flight and on Patchwork's Scans page, and on a push or a Scan now it sends the scan report and
# the package list to Patchwork through Ravenwood. The token is given only to the reporting steps, only on the default
# branch (its pushes, and a Scan now, which Ravenwood starts there), never on a pull request or any other branch, whose
# code (ci-report.py included) isn't on the default branch yet. The reporting steps run the system Python in isolated
# mode (/usr/bin/python3 -I), not the scanners' venv. What remains: every step runs as one user in one job, so code the
# scan step runs (from the same commit) could outlive it; the token reaches only that repo's scan workflows, push-scan
# reports and package list on its own item (panel 0.8.0 pass 2, R1-2). Each reporting step has a 3-minute limit and
# continue-on-error, so reporting never changes the check's result. Without the token the scan runs as before.
name: Security scan
on:
  pull_request:
    branches: [main, master, "rc-*", "release/**"]
  push:
    branches: [main, master, "rc-*", "release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report the start to Ravenwood
        env:
          RAVENWOOD_SCAN_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.RAVENWOOD_SCAN_TOKEN || '' }}
          RAVENWOOD_SCAN_ITEM: ${{ vars.RAVENWOOD_SCAN_ITEM }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          /usr/bin/python3 -I .githooks/ci-report.py start || true
          /usr/bin/python3 -I .githooks/ci-report.py step tools running || true
      - name: Install the scanners (pinned)
        id: tools
        run: |
          set -euo pipefail
          # Every package by version and SHA-256 (.github/security-scan-tools.lock), in a venv of its own.
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --quiet --require-hashes --no-deps -r .github/security-scan-tools.lock
          "$RUNNER_TEMP/tools/bin/python" -m pip check
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" shellcheck-v0.11.0/shellcheck
          sudo install -m 755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          test "$(command -v shellcheck)" = /usr/local/bin/shellcheck
          shellcheck --version | grep -qx "version: 0.11.0"
          command -v shellcheck npm
          if git ls-files | grep -q 'Cargo\.lock$'; then cargo install cargo-audit --version 0.22.2 --locked --quiet; fi
      - name: Report the scanners installed
        if: always()
        env:
          RAVENWOOD_SCAN_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.RAVENWOOD_SCAN_TOKEN || '' }}
          OUTCOME: ${{ steps.tools.outcome }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          R="/usr/bin/python3 -I"; C=.githooks/ci-report.py
          if [ "$OUTCOME" = success ]; then $R $C step tools passed || true; else $R $C step tools failed "$OUTCOME" || true; fi
          $R $C step scan running || true
      - name: Full security scan
        id: scan
        # On a pull request the scanner comes from the target branch, so a change to the scanner can't pass its own
        # check (the allowlist still comes from the pull request: it is the reviewed exception path). The first pull
        # request that adds the scanner has none on its target branch, so it uses its own.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          SCAN=.githooks/security-scan.py
          if [ -n "$BASE_REF" ] && git cat-file -e "origin/$BASE_REF:.githooks/security-scan.py" 2>/dev/null; then
            # The scanner and every helper it loads come from the target branch, never the pull request (DE-98:
            # security-scan.py loads threat-feed.py from its own folder).
            # The whole .githooks folder of the target branch, so no helper list needs keeping (DE-98 pass 2).
            mkdir -p "$RUNNER_TEMP/base"
            git archive "origin/$BASE_REF" .githooks | tar -x -C "$RUNNER_TEMP/base"
            # Captured first, so no early-exiting reader can make find fail under pipefail (pass 3 R2-4).
            found=$(find "$RUNNER_TEMP/base/.githooks" \( -name '*.pyc' -o -name '*.pyo' -o -name __pycache__ \) -print)
            if [ -n "$found" ]; then
              echo "compiled Python in the target branch's .githooks; refusing" >&2; exit 1
            fi
            SCAN="$RUNNER_TEMP/base/.githooks/security-scan.py"
            echo "scanner from $BASE_REF"
          fi
          python3 "$SCAN" --rev HEAD --mode full --report "$RUNNER_TEMP/security-scan.md"
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/security-scan.md" ]; then cat "$RUNNER_TEMP/security-scan.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Report the result to Ravenwood and Patchwork
        if: always()
        env:
          RAVENWOOD_SCAN_TOKEN: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.RAVENWOOD_SCAN_TOKEN || '' }}
          RAVENWOOD_SCAN_ITEM: ${{ vars.RAVENWOOD_SCAN_ITEM }}
          PATCHWORK_ASSET: ${{ vars.PATCHWORK_ASSET }}
          OUTCOME: ${{ steps.scan.outcome }}
          JOB: ${{ job.status }}
          EVENT: ${{ github.event_name }}
        timeout-minutes: 3
        continue-on-error: true
        run: |
          R="/usr/bin/python3 -I"; C=.githooks/ci-report.py; M="$RUNNER_TEMP/security-scan.md"
          case "$OUTCOME" in success) RES=pass; ST=passed; SS=passed ;; cancelled) RES=fail; ST=stopped; SS=skipped ;; *) RES=fail; ST=failed; SS=failed ;; esac
          # Cancelled before the scan began (during the install): the run stopped, it didn't fail.
          if [ "$JOB" = cancelled ]; then ST=stopped; SS=skipped; fi
          $R $C step scan "$SS" "$(grep -m1 '^Blocking findings:' "$M" 2>/dev/null || echo "$OUTCOME")" || true
          if [ "$EVENT" != pull_request ] && [ "$OUTCOME" != skipped ] && [ "$OUTCOME" != cancelled ] && [ -f "$M" ]; then
            $R $C step packages running || true
            $R $C record "$M" "$RES" || true
          elif [ "$EVENT" != pull_request ] && [ "$ST" != stopped ]; then
            # The scan wrote no report: still recorded, as a fail (panel 0.8.0 pass 3, R2-5).
            $R $C step packages skipped "no scan report ($OUTCOME)" || true
            $R $C record-missing "$OUTCOME" || true
            RES=fail; ST=failed
          else
            if [ "$EVENT" = pull_request ]; then WHY="pull request: recorded on the push"; else WHY="stopped"; fi
            $R $C step packages skipped "$WHY" || true
            $R $C step record skipped "$WHY" || true
          fi
          $R $C finish "$ST" "Scan $RES" || true
